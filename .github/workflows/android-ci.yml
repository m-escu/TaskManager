name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Daemon integration tests: compile the C++ daemon with the host toolchain
  # and pipe JSON through it against the runner's real /proc. No Android SDK
  # needed, so this fails fast and independently of the Android build.
  daemon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build daemon (host toolchain)
        run: bash taskmanagerd/host_tests/build_host.sh

      - name: Run protocol integration tests
        run: python3 taskmanagerd/host_tests/test_daemon.py

  # Android app: compile, run JVM unit tests, produce a debug APK artifact
  # for manual testing. No release pipeline (yet).
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest runners ship with the Android SDK preinstalled at
      # $ANDROID_HOME. Accept licenses, then install what the build needs.
      # Keep the NDK in sync with `ndk` in gradle/libs.versions.toml. The NDK
      # release string is embedded in libtaskmanagerd.so, so building with a
      # different NDK changes the native libraries (reproducible builds).
      # compileSdk release(37) { minorApiLevel = 0 } needs platforms;android-37.0,
      # which is not preinstalled either.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/28.0.13004108
          key: ndk-28.0.13004108

      - name: Install pinned build dependencies
        run: |
          NDK_VERSION=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          "$SDKMANAGER" --list_installed | grep -E "ndk;|platforms;android-37.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK + run unit tests
        run: ./gradlew :app:assembleDebug :main:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
